[project]
name = "imgwen-ado"
version = "0.1.0"
description = "Image editing / chat backend (SQLAlchemy + FastAPI)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "dashscope>=1.25.8",
  "openai>=1.68.0",
  "qdrant-client>=1.12.0",
  "debugpy>=1.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
