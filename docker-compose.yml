services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-web
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-api
    ports:
      - "8000:8000"
      - "5678:5678"
    environment:
      DEBUGPY_ENABLE: ${DEBUGPY_ENABLE:-0}
      DEBUGPY_WAIT: ${DEBUGPY_WAIT:-0}
      DEBUGPY_PORT: ${DEBUGPY_PORT:-5678}
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/app_db
      QDRANT_URL: http://qdrant:6333
      # Object storage (MinIO). Backend uses the internal endpoint; the browser fetches
      # images via MINIO_PUBLIC_URL (host-reachable). DashScope never sees these URLs.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      # Alibaba MaaS / Model Studio — set in .env (see .env.example). Optional split: reasoning vs editing gateway.
      DASHSCOPE_BASE_HTTP_API_URL: ${DASHSCOPE_BASE_HTTP_API_URL:-https://dashscope-intl.aliyuncs.com/api/v1}
      DASHSCOPE_REASONING_BASE_HTTP_API_URL: ${DASHSCOPE_REASONING_BASE_HTTP_API_URL:-}
      DASHSCOPE_EDITING_BASE_HTTP_API_URL: ${DASHSCOPE_EDITING_BASE_HTTP_API_URL:-}
      DASHSCOPE_OPENAI_COMPATIBLE_BASE_URL: ${DASHSCOPE_OPENAI_COMPATIBLE_BASE_URL:-}
      DASHSCOPE_OPENAI_RESPONSES_BASE_URL: ${DASHSCOPE_OPENAI_RESPONSES_BASE_URL:-}
      DASHSCOPE_PLANNER_ENABLE_THINKING: ${DASHSCOPE_PLANNER_ENABLE_THINKING:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_OPENAI_API_KEY: ${DASHSCOPE_OPENAI_API_KEY:-}
      DASHSCOPE_REASONING_API_KEY: ${DASHSCOPE_REASONING_API_KEY:-}
      DASHSCOPE_EDITING_API_KEY: ${DASHSCOPE_EDITING_API_KEY:-}
      DASHSCOPE_GENERATION_BASE_HTTP_API_URL: ${DASHSCOPE_GENERATION_BASE_HTTP_API_URL:-}
      DASHSCOPE_GENERATION_API_KEY: ${DASHSCOPE_GENERATION_API_KEY:-}
      QWEN_VISION_MODEL: ${QWEN_VISION_MODEL:-qwen-vl-max}
      QWEN_TEXT_MODEL: ${QWEN_TEXT_MODEL:-qwen-plus-latest}
      QWEN_IMAGE_EDIT_MODEL: ${QWEN_IMAGE_EDIT_MODEL:-qwen-image-edit-max}
      QWEN_IMAGE_GENERATION_MODEL: ${QWEN_IMAGE_GENERATION_MODEL:-wan2.2-t2i-plus}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v4}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: app-redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: app-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: app-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - app-network

volumes:
  postgres_data:
  qdrant_data:
  minio_data:

networks:
  app-network:
    name: app-network
