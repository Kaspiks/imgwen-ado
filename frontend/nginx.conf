server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Allow large bodies so embedded data URL uploads (base64-encoded images) go through.
  # Default nginx limit is 1MB which silently rejects 2MB image uploads as data URLs.
  client_max_body_size 10m;

  resolver 127.0.0.11 valid=30s;

  location /api {
    # Vision + planner + image edit often exceeds 2m; nginx 504 = Gateway Time-out.
    proxy_connect_timeout 75s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    # Use a variable so nginx resolves the upstream at request time, not at startup.
    set $backend http://api:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
